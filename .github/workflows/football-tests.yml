name: Modern football tests
on:
  push:
    paths: ['modern_football/**', 'tests/**', 'requirements-football.txt', '.github/workflows/football-tests.yml']
  pull_request:
    paths: ['modern_football/**', 'tests/**', 'requirements-football.txt', '.github/workflows/football-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-football.txt
      - run: python -m unittest discover -s tests -v
